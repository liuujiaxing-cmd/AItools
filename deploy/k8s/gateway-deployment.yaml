apiVersion: apps/v1
kind: Deployment
metadata:
  name: toolset-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: toolset-gateway
  template:
    metadata:
      labels:
        app: toolset-gateway
    spec:
      containers:
        - name: gateway
          image: toolset-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: RUNTIME_BASE_URL
              value: http://toolset-runtime:8081
            - name: REGISTRY_BASE_URL
              value: http://toolset-registry:8082
            - name: REDIS_URL
              value: redis://redis:6379/0
