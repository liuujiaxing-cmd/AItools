global:
  scrape_interval: 5s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]
    metrics_path: /metrics

  - job_name: runtime
    static_configs:
      - targets: ["runtime:8081"]
    metrics_path: /metrics

  - job_name: registry
    static_configs:
      - targets: ["registry:8082"]
    metrics_path: /metrics

