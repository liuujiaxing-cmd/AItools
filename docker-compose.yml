services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=toolset
    ports:
      - "5432:5432"

  registry:
    build:
      context: .
      dockerfile: deploy/docker/registry.Dockerfile
    environment:
      - PORT=8082
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/toolset
    depends_on:
      - postgres
    ports:
      - "8082:8082"

  runtime:
    build:
      context: .
      dockerfile: deploy/docker/runtime.Dockerfile
    environment:
      - PORT=8081
      - TOOLS_DIR=tools
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    ports:
      - "8081:8081"

  gateway:
    build:
      context: .
      dockerfile: deploy/docker/gateway.Dockerfile
    environment:
      - PORT=8080
      - RUNTIME_BASE_URL=http://runtime:8081
      - REGISTRY_BASE_URL=http://registry:8082
      - REDIS_URL=redis://redis:6379/0
      - GATEWAY_JWT_SECRET=change-me-in-prod
      - GATEWAY_ALLOWED_IPS=
      - GATEWAY_REQUIRE_SIGNATURE=false
    depends_on:
      - redis
      - registry
      - runtime
    ports:
      - "8080:8080"

  jaeger:
    image: jaegertracing/all-in-one:1.54
    ports:
      - "16686:16686"
      - "14268:14268"

  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - gateway
      - runtime
      - registry

  grafana:
    image: grafana/grafana:11.0.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
